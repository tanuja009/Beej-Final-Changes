<!DOCTYPE html>
<html>

<head>
  <title>Button Test - Simple</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>
    body {
      font-family: Arial;
      padding: 40px;
      background: linear-gradient(135deg, #1B5E20, #4CAF50);
      min-height: 100vh;
    }

    .test-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      color: #2E7D32;
    }

    .status {
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
      font-weight: bold;
    }

    .success {
      background: #C8E6C9;
      color: #1B5E20;
    }

    .error {
      background: #FFCDD2;
      color: #C62828;
    }

    .test-btn {
      padding: 12px 24px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .test-btn:hover {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.5);
    }

    #log {
      background: #f5f5f5;
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="test-card">
    <h1>🧪 Button Click Test</h1>

    <div id="status" class="status error">
      Button not clicked yet
    </div>

    <p>Click the button below to test if buttons work in your browser:</p>

    <button class="test-btn" onclick="testClick()">
      <span class="material-icons">app_registration</span>
      Test Button Click
    </button>

    <div id="log"></div>
  </div>

  <script>
    let clickCount = 0;

    function log(message) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<div>[${time}] ${message}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    function testClick() {
      clickCount++;
      log(`✅ Button clicked! Count: ${clickCount}`);

      const status = document.getElementById('status');
      status.className = 'status success';
      status.textContent = `✅ SUCCESS! Button clicked ${clickCount} time(s)`;

      if (clickCount === 1) {
        log('🎉 Great! Your button clicks work.');
        log('📝 Now test the actual "New Society Registration" button in index.html');
      }
    }

    // Test on page load
    window.onload = function () {
      log('✅ Page loaded');
      log('✅ Waiting for button click...');
    };
  </script>
</body>

</html>
